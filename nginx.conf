server {
    listen 80;
    server_name localhost;
    index index.php;
    root /var/www/html;

    client_max_body_size 100M;

    # Static files - cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Upload directory
    location /temp_uploads/ {
        alias /var/www/html/temp_uploads/;
        try_files $uri =404;
    }

    # REST API routes
    location /api/ {
        try_files $uri /api/index.php$is_args$args;
    }

    # Root: branded sign-in page (checks session itself, renders the form or
    # redirects home if already logged in) — bypasses the PHPMaker app router
    # for this one path, same as the original project's standalone root index.php.
    location = / {
        rewrite ^ /app/pages/login.php last;
    }

    # Main app
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /(vendor/|composer\.json|composer\.lock|\.env) {
        deny all;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}